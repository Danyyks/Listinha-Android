# ============================================================
#  gradle.properties  —  ajustes globais do build
# ============================================================

# Memória que o Gradle pode usar ao compilar (2GB). Evita travar em projetos maiores.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Compila os módulos em paralelo quando possível (mais rápido).
org.gradle.parallel=true

# Liga o AndroidX (biblioteca moderna de componentes do Android). Obrigatório hoje.
android.useAndroidX=true

# Padrão de estilo de código do Kotlin usado pela IDE.
kotlin.code.style=official

# Cada módulo gera sua própria classe R (de recursos), deixando o build mais enxuto.
android.nonTransitiveRClass=true
