# ============================================================
#  Catálogo de versões (Version Catalog)
# ------------------------------------------------------------
#  É a "lista de compras" de bibliotecas do projeto, num lugar só.
#  Vantagem: se precisar atualizar uma versão, muda AQUI e vale
#  para o projeto inteiro. É o padrão moderno recomendado pelo Google.
#
#  Estrutura:
#   [versions]  -> os números de versão, com apelidos
#   [libraries] -> as bibliotecas, apontando para uma versão acima
#   [plugins]   -> os plugins do Gradle
# ============================================================

[versions]
agp = "8.7.3"                     # Android Gradle Plugin (constrói o app)
kotlin = "2.0.21"                 # versão da linguagem Kotlin
coreKtx = "1.15.0"                # utilidades Kotlin para o Android
lifecycleRuntimeKtx = "2.8.7"     # ciclo de vida (telas que reagem a pausar/retomar)
activityCompose = "1.9.3"         # cola entre a Activity e o Compose
composeBom = "2024.12.01"         # "BOM": alinha as versões de todo o Compose de uma vez
googleServices = "4.4.2"          # plugin que lê o google-services.json e conecta o app ao Firebase
firebaseBom = "33.7.0"            # BOM do Firebase (alinha auth + firestore na mesma versão)
coroutines = "1.9.0"              # corrotinas: jeito do Kotlin de fazer tarefas em segundo plano (rede/banco)
credentials = "1.3.0"             # Credential Manager: jeito moderno de login no Android
googleid = "1.1.1"                # opção "Entrar com Google" para o Credential Manager
coil = "2.7.0"                    # carrega imagens da internet (a foto do perfil)
coreSplashscreen = "1.0.1"        # tela de abertura (splash) padrão do Android

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# O BOM (Bill of Materials) não é uma biblioteca em si: ele só DECIDE as versões
# de todas as bibliotecas do Compose abaixo, para nunca ficarem incompatíveis.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }

# Liga a tela (Compose) com a lógica (ViewModel) e com o ciclo de vida.
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }

# Firebase: o BOM decide as versões; auth = login, firestore = banco de dados.
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }

# Corrotinas: "-play-services" traz o .await(), que espera o Firebase responder sem travar a tela.
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

# Login moderno: Credential Manager + a opção "Entrar com Google".
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }

# Coil: carrega e mostra imagens de uma URL (a foto do usuário) no Compose.
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# Tela de abertura (splash) oficial do Android.
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
