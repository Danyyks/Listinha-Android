# ============================================================
#  Gradle Wrapper  —  "trava" a versão do Gradle do projeto
# ------------------------------------------------------------
#  Assim, qualquer pessoa que abrir o projeto usa EXATAMENTE a
#  mesma versão do Gradle, sem precisar instalar nada na mão.
#  O Android Studio baixa a versão indicada aqui automaticamente
#  na primeira sincronização.
# ============================================================
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
